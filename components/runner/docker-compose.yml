services:
  # Copies the SSH key into a volume owned by the Runner's non-root user. A bind-mounted key
  # keeps its host ownership, which the Runner's uid does not match, so it cannot read it
  # directly. Runs as root to read the key, exits before the Runner starts, and has no network.
  ssh-key-stage:
    image: alpine:3.22
    user: "0:0"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - /bin/sh
      - -c
      - |
        set -e
        install -d -m 700 -o 1654 -g 1654 /staged
        [ -f /src/id_rsa ] && install -m 600 -o 1654 -g 1654 /src/id_rsa /staged/id_rsa
        [ -f /src/known_hosts ] && install -m 644 -o 1654 -g 1654 /src/known_hosts /staged/known_hosts
        exit 0
    volumes:
      - ./config:/src:ro
      - runner-ssh:/staged

  snapcd-runner:
    image: ghcr.io/schrieksoft/snapcd/snapcd-runner-azure:1.16.1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/app:uid=1654,gid=1654,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 512M
    command: ["--urls", "http://0.0.0.0:5001"]
    depends_on:
      ssh-key-stage:
        condition: service_completed_successfully
    volumes:
      - ./config/appsettings.json:/app/appsettings.json:ro
      # Optional: layer environment-specific overrides on top of the committed defaults.
      # Create components/runner/config/appsettings.Production.json (gitignored), then
      # uncomment. Leave it commented if you have no overrides.
      # - ./config/appsettings.Production.json:/app/appsettings.Production.json:ro

      # Must be unique per compose project when running several instances side by side.
      # A named volume is initialised from the image, so it is owned by the Runner's
      # non-root user. A host directory keeps its own ownership and must be chowned to
      # 1654:1654 first; uncomment the bind mount below if you need one.
      - runner-data:/app/runnerdata
      # - ${RUNNER_DATA_DIR:-~/.snapcd/runner-data}:/app/runnerdata

      # Pre-approved hooks directory (optional)
      - ./config/preapproved-hooks:/app/preapproved-hooks:ro

      # SSH keys for private Git repositories (optional), staged by ssh-key-stage above.
      # Put id_rsa and known_hosts in components/runner/config/ at any permissions you like.
      - runner-ssh:/home/app/.ssh

      # Terraform/OpenTofu binaries from host (pick one or both, edit path as needed)
      - /usr/local/bin/terraform:/usr/local/bin/terraform:ro
      - /usr/local/bin/tofu:/usr/local/bin/tofu:ro
    networks:
      - snapcd-net

  # Forwards two ports on the Runner's own localhost: 5000 to the Server, and
  # 9000 to the host machine, so URLs like http://localhost:5000 work identically
  # on the host and inside the Runner (e.g. a state store served from the host).
  runner-loopback:
    image: alpine/socat
    restart: unless-stopped
    network_mode: "service:snapcd-runner"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - snapcd-runner
    entrypoint: ["sh", "-c",
      "socat TCP6-LISTEN:5000,fork,reuseaddr,ipv6only=0 TCP:snapcd-server:5000 & exec socat TCP6-LISTEN:9000,fork,reuseaddr,ipv6only=0 TCP:$(ip route | awk '/default/{print $3; exit}'):9000"]

volumes:
  runner-data:
  runner-ssh:

networks:
  snapcd-net:
