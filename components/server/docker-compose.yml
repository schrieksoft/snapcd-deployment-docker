services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 2G
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "myPassw0rd"
      MSSQL_PID: "Express"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - snapcd-net
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "myPassw0rd" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - snapcd-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  snapcd-server:
    image: ghcr.io/schrieksoft/snapcd/snapcd-server:1.15.13
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/app:uid=1654,gid=1654,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      # Env vars override appsettings.json; the externally reachable host follows the published port.
      Server__Host: "http://localhost:${SNAPCD_SERVER_PORT:-5000}"
    ports:
      - "${SNAPCD_SERVER_PORT:-5000}:5000"
    volumes:
      - ./config/appsettings.json:/app/appsettings.json:ro
      # Optional: layer environment-specific overrides on top of the committed defaults.
      # Create components/server/config/appsettings.Production.json (gitignored), then
      # uncomment. Leave it commented if you have no overrides.
      # - ./config/appsettings.Production.json:/app/appsettings.Production.json:ro
    networks:
      - snapcd-net

volumes:
  mssqldata:

networks:
  snapcd-net:
